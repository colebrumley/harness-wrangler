[workspace]
resolver = "2"
members = ["crates/wrangler-core", "crates/wrangler-cli"]
default-members = ["crates/wrangler-core", "crates/wrangler-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.dev.package."*"]
opt-level = 1
